name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v5

      - name: Install valgrind (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build (warnings are errors)
        run: make CC="$CC" CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O2 -g"

      - name: Test suite
        run: make test CC="$CC"

      - name: Run all examples
        run: make examples CC="$CC"

      - name: Memory check (Linux)
        if: runner.os == 'Linux'
        run: make memcheck CC="$CC"

  wasm-playground:
    name: WebAssembly build + playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install clang and the WASI sysroot
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 wasi-libc libclang-rt-18-dev-wasm32

      - name: Build native + wasm, check equivalence, bundle the playground
        run: make playground WASM_CC=clang-18

      - name: Upload playground
        uses: actions/upload-artifact@v4
        with:
          name: minic-playground
          path: build/playground/index.html

